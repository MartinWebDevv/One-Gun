name: Deploy Development Client

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: one-gun-client-dev
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.1
  GODOT_STATUS: stable
  ITCH_TARGET: one-gun/one-gun
  ITCH_CHANNEL: windows-dev
  BUTLER_URL: https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default

jobs:
  build-and-publish:
    name: Build and publish Windows client
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare immutable build identity
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7).ToLowerInvariant()
          "BUILD_ID=dev-$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stamp client build metadata
        shell: pwsh
        run: >-
          ./tools/stamp_build.ps1
          -BuildId $env:BUILD_ID
          -Channel dev
          -CommitSha $env:GITHUB_SHA

      - name: Verify generated build metadata
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath ./build_metadata.json)) {
            throw "build_metadata.json is missing after stamping."
          }
          $metadata = Get-Content -LiteralPath ./build_metadata.json -Raw | ConvertFrom-Json
          if ($metadata.build_id -ne $env:BUILD_ID) {
            throw "Stamped build '$($metadata.build_id)' does not match '$env:BUILD_ID'."
          }

      - name: Install Godot and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = "$env:GODOT_VERSION-$env:GODOT_STATUS"
          $baseUrl = "https://github.com/godotengine/godot/releases/download/$release"
          $editorZipName = "Godot_v${release}_win64.exe.zip"
          $templatesName = "Godot_v${release}_export_templates.tpz"
          $editorZip = Join-Path $env:RUNNER_TEMP $editorZipName
          $templatesArchive = Join-Path $env:RUNNER_TEMP $templatesName
          $editorDir = Join-Path $env:RUNNER_TEMP "godot"
          $templatesDir = Join-Path $env:RUNNER_TEMP "export-templates"

          curl.exe --fail --location --retry 3 --silent --show-error `
            --output $editorZip "$baseUrl/$editorZipName"
          if ($LASTEXITCODE -ne 0) { throw "Godot editor download failed." }
          curl.exe --fail --location --retry 3 --silent --show-error `
            --output $templatesArchive "$baseUrl/$templatesName"
          if ($LASTEXITCODE -ne 0) { throw "Godot export-template download failed." }

          Expand-Archive -LiteralPath $editorZip -DestinationPath $editorDir
          $templatesZip = Join-Path $env:RUNNER_TEMP "export-templates.zip"
          Copy-Item -LiteralPath $templatesArchive -Destination $templatesZip
          Expand-Archive -LiteralPath $templatesZip -DestinationPath $templatesDir

          # The console wrapper is the synchronous CLI entry point. The GUI
          # executable can return before a non-interactive import has finished.
          $godotBinary = Join-Path $editorDir "Godot_v${release}_win64_console.exe"
          if (-not (Test-Path -LiteralPath $godotBinary)) {
            throw "Godot executable is missing at $godotBinary."
          }
          $templateTarget = Join-Path $env:APPDATA `
            "Godot/export_templates/$env:GODOT_VERSION.$env:GODOT_STATUS"
          New-Item -ItemType Directory -Path $templateTarget -Force | Out-Null
          Copy-Item -Path (Join-Path $templatesDir "templates/*") `
            -Destination $templateTarget -Recurse -Force

          "GODOT_BIN=$godotBinary" | Out-File `
            -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $version = (& $godotBinary --headless --version | Out-String).Trim()
          if (-not $version.StartsWith("$env:GODOT_VERSION.$env:GODOT_STATUS")) {
            throw "Unexpected Godot version: $version"
          }

      - name: Import and verify client assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $projectRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $importCache = [IO.Path]::GetFullPath((Join-Path $projectRoot ".godot"))
          $workspacePrefix = $projectRoot.TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
          if (-not $importCache.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to clear import cache outside the GitHub workspace: $importCache"
          }
          if (Test-Path -LiteralPath $importCache) {
            Remove-Item -LiteralPath $importCache -Recurse -Force
          }

          $trackedFiles = @(git ls-files)
          if ($LASTEXITCODE -ne 0) { throw "Could not enumerate tracked project files." }
          $missingTrackedFiles = @($trackedFiles | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $projectRoot $_))
          })
          if ($missingTrackedFiles.Count -gt 0) {
            throw "Git checkout is missing $($missingTrackedFiles.Count) tracked files."
          }
          [long]$trackedBytes = ($trackedFiles | ForEach-Object {
            (Get-Item -LiteralPath (Join-Path $projectRoot $_)).Length
          } | Measure-Object -Sum).Sum
          if ($trackedFiles.Count -lt 2000 -or $trackedBytes -lt 600MB) {
            throw "Git checkout is unexpectedly small: $($trackedFiles.Count) files, $trackedBytes bytes."
          }
          Write-Output "Verified source checkout: $($trackedFiles.Count) files, $trackedBytes bytes."

          $importLines = @(& $env:GODOT_BIN --headless --verbose `
            --path $projectRoot --import 2>&1)
          $importExitCode = $LASTEXITCODE
          $importLines | ForEach-Object { Write-Output $_ }
          if ($importExitCode -ne 0) {
            Write-Output "::error::Godot asset import failed with exit code $importExitCode."
            throw "Godot asset import failed."
          }

          $importedDir = Join-Path $PWD ".godot/imported"
          if (-not (Test-Path -LiteralPath $importedDir)) {
            Write-Output "::error title=Missing Godot import cache::.godot/imported was not created."
            throw "Godot import cache directory is missing."
          }
          $importedFiles = @(Get-ChildItem -LiteralPath $importedDir -File)
          [long]$importedBytes = ($importedFiles | Measure-Object Length -Sum).Sum
          if ($importedFiles.Count -lt 500 -or $importedBytes -lt 100MB) {
            $message = "Godot import cache is incomplete: $($importedFiles.Count) files, $importedBytes bytes."
            $outputTail = if ($importLines.Count -gt 0) {
              ($importLines | Select-Object -Last 20) -join "`n"
            } else {
              "<Godot produced no output>"
            }
            $escapedTail = $outputTail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Incomplete Godot import cache::$message Godot output tail: $escapedTail"
            throw $message
          }

          $requiredImports = @(
            "UI/MainMenu/OneGunLogoV2.png.import",
            "UI/assets/character_portraits/green.png.import",
            "models/menu/TrophyPedestal.glb.import",
            "models/player_v2/animations/Idle.fbx.import",
            "audio/MainMenu.wav.import"
          )
          foreach ($sidecar in $requiredImports) {
            $contents = Get-Content -LiteralPath $sidecar -Raw
            $match = [regex]::Match($contents, '(?m)^path="res://([^"]+)"')
            if (-not $match.Success) {
              $message = "Could not resolve imported resource path from $sidecar."
              Write-Output "::error title=Invalid Godot import sidecar::$message"
              throw $message
            }
            $relativePath = $match.Groups[1].Value.Replace('/', [IO.Path]::DirectorySeparatorChar)
            $importedPath = Join-Path $PWD $relativePath
            if (-not (Test-Path -LiteralPath $importedPath)) {
              $message = "Required imported resource is missing: $importedPath"
              Write-Output "::error title=Missing imported client resource::$message"
              throw $message
            }
            if ((Get-Item -LiteralPath $importedPath).Length -lt 32) {
              $message = "Required imported resource is empty or truncated: $importedPath"
              Write-Output "::error title=Truncated imported client resource::$message"
              throw $message
            }
          }

          Write-Output "Verified $($importedFiles.Count) imported files ($importedBytes bytes)."

      - name: Export Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outputDir = Join-Path $PWD "build/client-windows"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          $exportOut = Join-Path $env:RUNNER_TEMP "godot-windows-export.stdout.log"
          $exportErr = Join-Path $env:RUNNER_TEMP "godot-windows-export.stderr.log"
          $exportProcess = Start-Process -FilePath $env:GODOT_BIN `
            -ArgumentList @(
              "--headless", "--path", ".", "--export-release",
              "One Gun - Windows", (Join-Path $outputDir "OneGun.exe")) `
            -WorkingDirectory $PWD -Wait -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $exportOut -RedirectStandardError $exportErr
          Get-Content -LiteralPath $exportOut
          Get-Content -LiteralPath $exportErr
          if ($exportProcess.ExitCode -ne 0) {
            Write-Output "::error::Godot Windows export failed with exit code $($exportProcess.ExitCode)."
            throw "Godot Windows export failed."
          }

          $exe = Get-Item -LiteralPath (Join-Path $outputDir "OneGun.exe")
          $pck = Get-Item -LiteralPath (Join-Path $outputDir "OneGun.pck")
          if ($exe.Length -le 0 -or $pck.Length -le 0) {
            throw "Godot exported an empty Windows artifact."
          }
          if ($pck.Length -lt 100MB) {
            throw "OneGun.pck is unexpectedly small ($($pck.Length) bytes); client assets were not packaged."
          }
          Write-Output "Exported OneGun.pck: $($pck.Length) bytes."

      - name: Verify packaged build identity
        shell: bash
        run: |
          set -euo pipefail
          if ! grep --binary-files=text --fixed-strings --quiet \
            "$BUILD_ID" build/client-windows/OneGun.pck; then
            echo "::error::OneGun.pck does not contain expected build ID '$BUILD_ID'."
            exit 1
          fi

      - name: Validate packaged client resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $validationOut = Join-Path $env:RUNNER_TEMP "godot-client-validation.stdout.log"
          $validationErr = Join-Path $env:RUNNER_TEMP "godot-client-validation.stderr.log"
          $pck = Join-Path $PWD "build/client-windows/OneGun.pck"
          $validator = Join-Path $PWD "tools/validate_client_package.gd"
          $validationProcess = Start-Process -FilePath $env:GODOT_BIN `
            -ArgumentList @(
              "--headless", "--main-pack", $pck, "--script", $validator) `
            -WorkingDirectory $PWD -Wait -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $validationOut -RedirectStandardError $validationErr
          Get-Content -LiteralPath $validationOut
          Get-Content -LiteralPath $validationErr
          if ($validationProcess.ExitCode -ne 0) {
            Write-Output "::error::Packaged client resource validation failed with exit code $($validationProcess.ExitCode)."
            throw "Packaged client resource validation failed."
          }
          if (-not (Select-String -LiteralPath $validationOut `
              -SimpleMatch "CLIENT_PACKAGE_VALIDATION_OK" -Quiet)) {
            throw "Packaged client validator did not report success."
          }

      - name: Install Butler
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "butler.zip"
          $butlerDir = Join-Path $env:RUNNER_TEMP "butler"
          curl.exe --fail --location --retry 3 --silent --show-error `
            --output $archive $env:BUTLER_URL
          if ($LASTEXITCODE -ne 0) { throw "Butler download failed." }
          Expand-Archive -LiteralPath $archive -DestinationPath $butlerDir
          $butlerBinary = Join-Path $butlerDir "butler.exe"
          if (-not (Test-Path -LiteralPath $butlerBinary)) {
            throw "Butler executable is missing."
          }
          "BUTLER_BIN=$butlerBinary" | Out-File `
            -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $butlerBinary --version
          if ($LASTEXITCODE -ne 0) { throw "Butler failed to start." }

      - name: Publish Windows client to itch.io
        shell: pwsh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BUTLER_API_KEY)) {
            throw "Required repository secret BUTLER_API_KEY is missing."
          }
          $target = "$($env:ITCH_TARGET):$($env:ITCH_CHANNEL)"
          & $env:BUTLER_BIN validate "build/client-windows"
          if ($LASTEXITCODE -ne 0) { throw "Butler validation failed." }
          & $env:BUTLER_BIN push "build/client-windows" $target `
            --userversion $env:BUILD_ID
          if ($LASTEXITCODE -ne 0) { throw "Butler upload failed." }
          & $env:BUTLER_BIN status $env:ITCH_TARGET
          if ($LASTEXITCODE -ne 0) { throw "Butler status check failed." }

      - name: Write workflow summary
        if: success()
        shell: pwsh
        run: |
          @"
          ## One Gun development client

          - Build: $env:BUILD_ID
          - Godot: $env:GODOT_VERSION.$env:GODOT_STATUS
          - itch.io target: $($env:ITCH_TARGET):$($env:ITCH_CHANNEL)
          - Client runner: Windows
          - Package validation: passed
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
